<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-op board — applying…</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f2ee;color:#17171a;font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:34rem;padding:28px 30px;background:#fff;border:1px solid #e3e0da;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
  h1{margin:0 0 6px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#8a857c}
  p{margin:10px 0 0}
  .big{font-size:18px;font-weight:600}
  .mute{color:#6c6860;font-size:13px}
  a{color:#1d4ed8}
  @media (prefers-color-scheme:dark){body{background:#17171a;color:#eee}.card{background:#1f1f23;border-color:#33333a}}
</style>
</head>
<body>
<div class="card">
  <h1>Co-op board</h1>
  <p class="big" id="m">starting…</p>
  <p class="mute" id="s"></p>
  <p class="mute">Keep the board tab open while this runs — it feeds this tab each application and records the results.</p>
</div>
<script>
"use strict";
/* The relay: the one page that both the board tab and the form tab can reach.
   The board leaves a payload in localStorage (same origin as this page) and this tab carries it
   into the portal in the URL hash, so nothing depends on window.opener — which LinkedIn,
   Workday and friends cut as soon as the tab navigates. Results come back the same way. */
const $ = id => document.getElementById(id);
const say = (t, sub) => { $("m").textContent = t; if (sub !== undefined) $("s").textContent = sub; };
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
const P = new URLSearchParams(location.hash.slice(1));
const getQ = () => { try { return JSON.parse(localStorage.getItem("coop-batch") || "null"); } catch (e) { return null; } };
const putQ = q => localStorage.setItem("coop-batch", JSON.stringify(q));

async function go(id, name) {
  for (let i = 0; i < 60; i++) {                        // the board stages each payload just before its turn
    const raw = localStorage.getItem("coop-q-" + id);
    if (raw) {
      let j; try { j = JSON.parse(raw); } catch (e) { say("that application's payload is corrupted", "go back to the board and click Apply again"); return; }
      say("opening " + (name || j.payload.job.company) + "…", j.applyUrl);
      location.replace(j.applyUrl + "#coop=" + id + "&p=" + b64e(JSON.stringify(j.payload)));
      return;
    }
    say("getting " + (name || "the application") + " ready…", i > 6 ? "waiting on the board tab — is it still open?" : "");
    await new Promise(r => setTimeout(r, 500));
  }
  say("the board tab never sent this application", "open the board, make sure it's the tab you started from, and click Apply again");
}

function next() {
  const q = getQ();
  if (!q || !q.ids || !q.ids.length) { say("nothing queued", "go to the board and pick some postings"); return; }
  if (q.i >= q.ids.length) {
    putQ({ ...q, finished: true });
    say(`Done — ${q.done} of ${q.ids.length} submitted.`, q.done < q.ids.length ? "The rest are marked on the board with what they need. You can close this tab." : "You can close this tab.");
    return;
  }
  say(`Application ${q.i + 1} of ${q.ids.length}…`);
  go(q.ids[q.i], q.names && q.names[q.i]);
}

if (P.has("done")) {
  let r = null; try { r = JSON.parse(b64d(P.get("done"))); } catch (e) {}
  if (!r) { say("couldn't read that result"); }
  else {
    localStorage.setItem("coop-r-" + r.id, JSON.stringify({ ...r, seen: Date.now() }));   // the board tab hears this
    const q = getQ();
    if (q && q.ids[q.i] === r.id) { q.i++; if (r.ok) q.done++; putQ(q); say(r.ok ? "submitted ✓ — next one…" : "recorded — next one…"); setTimeout(next, 900); }
    else say(r.ok ? "submitted ✓ recorded on the board" : "recorded on the board", "You can close this tab.");
  }
} else if (P.has("go")) {
  const q = getQ(); if (q) putQ({ ...q, i: 0, done: 0, finished: false });
  next();
} else if (P.has("next")) next();
else say("nothing to do", "this page is opened by the co-op board");
</script>
</body>
</html>
