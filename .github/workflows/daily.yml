name: daily co-op scrape

on:
  schedule:
    - cron: "30 12 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install optional LinkedIn/Indeed scraper
        run: pip install python-jobspy || echo "jobspy install failed, continuing without it"
        continue-on-error: true
      - name: run scraper
        run: python -m scraper.main
      - name: commit results
        run: |
          set -e
          git config user.name "coop-scraper bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "scrape $(date -u '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $i lost a race, retrying"
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1
