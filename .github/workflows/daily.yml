name: daily co-op scrape

on:
  schedule:
    - cron: "5,35 11-23 * * *"   # every 30 min, 7am-8pm ET (Actions minutes are free on public repos)
    - cron: "5 3 * * *"          # one overnight pass
    - cron: "0 9 1 * *"          # monthly: re-run ATS discovery for config/candidates.json
  workflow_dispatch:
    inputs:
      discover:
        description: "also run ATS discovery for config/candidates.json"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# never let two runs push at once; a second trigger waits for the first to finish
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install optional LinkedIn/Indeed scraper
        run: pip install python-jobspy || echo "jobspy install failed, continuing without it"
        continue-on-error: true
      - name: run scraper
        run: set -o pipefail; python -m scraper.main 2>&1 | tee data/run.log
      - name: ATS discovery (manual "discover" runs + monthly)
        if: ${{ inputs.discover || github.event.schedule == '0 9 1 * *' }}
        run: python -m scraper.discover 2>&1 | tee data/discover.log
        continue-on-error: true
      - name: outreach leads (funding news)
        run: python -m scraper.leads 2>&1 | tail -3
        continue-on-error: true
      - name: alerts (GitHub issue -> email, ntfy -> phone)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python -m scraper.alerts
        continue-on-error: true
      - name: commit results
        run: |
          set -e
          git config user.name "coop-scraper bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "scrape $(date -u '+%F %H:%M')"
          # someone (you, or an overlapping run) may have pushed since checkout
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $i lost a race, retrying"
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1
