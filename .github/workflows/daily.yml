name: daily co-op scrape

on:
  schedule:
    - cron: "30 12 * * *"   # 12:30 UTC = 5:30am PT / 8:30am ET, every day
    - cron: "30 22 * * *"   # and 3:30pm PT, so afternoon postings show up the same day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install optional LinkedIn/Indeed scraper
        run: pip install python-jobspy || echo "jobspy install failed, continuing without it"
        continue-on-error: true
      - name: run scraper
        run: python -m scraper.main
      - name: commit results
        run: |
          git config user.name "coop-scraper bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "scrape $(date -u +%F %H:%M)"
          git push
