name: fast co-op scan

on:
  schedule:
    - cron: "*/10 11-23 * * *"   # every 10 min, 7am-8pm ET: direct company feeds only (~2 min a run)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# never let two runs push at once; a second trigger waits for the first to finish
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run scraper
        run: set -o pipefail; python -m scraper.main --fast 2>&1 | tee data/run_fast.log
      - name: alerts (GitHub issue -> email, ntfy -> phone)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python -m scraper.alerts
        continue-on-error: true
      - name: commit results
        run: |
          set -e
          git config user.name "coop-scraper bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "fast scan $(date -u '+%F %H:%M')"
          # someone (you, or an overlapping run) may have pushed since checkout
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $i lost a race, retrying"
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1
